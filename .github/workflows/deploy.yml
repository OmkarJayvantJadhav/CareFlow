name: Deploy to Hugging Face Spaces

# On every push to main (and on demand), the repository is uploaded to the Space, which builds the
# Dockerfile. Needs the repository secret HF_TOKEN (a Hugging Face write token) and the repository
# variable HF_SPACE (e.g. "your-name/careflow"). The Space itself holds DATABASE_URL, GROQ_API_KEY,
# GEMINI_API_KEY and AUTH_SECRET as Space secrets; migrations and seeding run when the container starts.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub==0.26.2
      - name: Prepare the Space contents
        run: |
          mkdir -p space
          git ls-files | grep -v -E '^(\.github/|tests/|eval/runs/|eval/datasets/|docs/demo/)' > files.txt
          rsync -a --files-from=files.txt ./ space/
          # A Space reads its settings from the front matter of its README.
          {
            printf -- '---\ntitle: CareFlow\nemoji: 🏥\ncolorFrom: green\ncolorTo: blue\nsdk: docker\napp_port: 7860\npinned: false\nshort_description: OPD booking assistant and live queue (demo, fictional hospital)\n---\n\n'
            cat README.md
          } > space/README.md
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(folder_path="space", repo_id=os.environ["HF_SPACE"], repo_type="space",
                            commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}", delete_patterns=["*"])
          print(f"https://huggingface.co/spaces/{os.environ['HF_SPACE']}")
          PY
