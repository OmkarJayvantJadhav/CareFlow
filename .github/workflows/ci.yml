name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow
          POSTGRES_DB: careflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://careflow:careflow@localhost:5432/careflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unit, integration, concurrency)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg PRELOAD_MODELS=false -t careflow:ci .
      - name: Smoke-test the image (LightGBM and the trained wait-time model load)
        run: >
          docker run --rm --entrypoint python careflow:ci -c
          "from app.ml.model import LightGbmModel, ARTIFACT_DIR; m = LightGbmModel(ARTIFACT_DIR); print(m.version)"
