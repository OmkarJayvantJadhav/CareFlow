name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow
          POSTGRES_DB: careflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://careflow:careflow@localhost:5432/careflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unit, integration, concurrency, agent with a scripted LLM)
        run: pytest

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check and unit tests
        run: |
          npx tsc --noEmit
          npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test, ui]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow
          POSTGRES_DB: careflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://careflow:careflow@localhost:5432/careflow_test
      E2E_DATABASE_URL: postgresql+psycopg://careflow:careflow@localhost:5432/careflow_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build the UI
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: Browser tests (all nine screens, accessibility, live queue)
        run: pytest -m e2e tests/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: tests/e2e/server.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (UI + API)
        run: docker build -t careflow:ci .
      - name: Smoke-test the image (the wait-time model loads and the UI is inside)
        run: >
          docker run --rm --entrypoint python careflow:ci -c
          "from pathlib import Path; from app.ml.model import LightGbmModel, ARTIFACT_DIR;
          print(LightGbmModel(ARTIFACT_DIR).version); assert Path('ui/dist/index.html').exists()"
