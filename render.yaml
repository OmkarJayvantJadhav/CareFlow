# The demo host (docs §12): the Docker image on Render's free web service (512 MB RAM).
# Create it with New → Blueprint, then paste the secret values when Render asks for them.
services:
  - type: web
    name: careflow
    runtime: docker
    plan: free
    region: singapore
    branch: develop
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "7860"
      - key: DEMO_MODE
        value: "true"
      # The demo's features (try-a-role buttons, reset) without labelling the hospital as fictional on the
      # site (D-132). The repository's README still says it is a portfolio project.
      - key: DEMO_NOTICE
        value: "false"
      # The local retriever: the configuration every published evaluation result was measured
      # with, and the one that fits in 512 MB (the neural models need about 1 GB).
      - key: EMBEDDING_BACKEND
        value: local
      - key: RERANKER_BACKEND
        value: local
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Encrypts patients' phone numbers; keep it when changing AUTH_SECRET.
      - key: DATA_KEY
        generateValue: true
