# Backup host (docs §12): the same Docker image on Render's free web service.
# Create it from this blueprint, then set the secret values in the Render dashboard.
services:
  - type: web
    name: careflow
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "7860"
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
